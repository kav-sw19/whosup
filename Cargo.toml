[package]
name = "whosup"
version = "0.1.0"
edition = "2024"
description = "A live terminal view of your coding-agent sessions (pi, Claude Code, Codex, …), their sub-agents and open terminals"
license = "MIT"
repository = "https://github.com/kav-sw19/whosup"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6"
